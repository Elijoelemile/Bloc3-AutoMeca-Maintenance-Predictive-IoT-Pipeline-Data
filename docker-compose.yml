# Kafka + ClickHouse + Grafana auto-heberges (Bloc 3) — sur l'instance
# Compute (cloud souverain europeen) partagee avec les conteneurs API/UI
# du Bloc 4 (voir le README du Bloc 2, section "Contraintes de cout et
# choix d'infrastructure", pour la justification complete : Kafka et
# ClickHouse manages coutent a eux seuls plus qu'une instance simple).
#
# Le pipeline Bloc 3 (Airflow, extraction, ingestion) tourne EN LOCAL
# sur le poste candidat (voir README, section "Mode d'execution
# Airflow") — pas sur cette instance. Kafka et ClickHouse doivent donc
# etre joignables depuis l'exterieur : ports publies sur l'IP publique
# de l'instance, restreints par le pare-feu reseau a l'IP du poste
# candidat (pas de VPN complet : disproportionne pour une demo de
# certification limitee dans le temps).
#
# Pas de TLS entre le pipeline local et ClickHouse (port HTTP 8123, pas
# 8443) : la protection en transit repose ici sur la restriction IP du
# pare-feu, pas le chiffrement — compromis assume, documente dans
# .env.example. Meme principe pour Kafka (PLAINTEXT, pas SASL_SSL).
services:
  kafka:
    # Image officielle Apache Kafka (pas Bitnami : leurs tags versionnes
    # comme 3.7 ont ete retires du Docker Hub gratuit courant 2025 — pas
    # dispo au moment du deploiement reel, voir le README pour la trace).
    # Mode KRaft natif, pas de Zookeeper separe.
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - CLUSTER_ID=${KAFKA_CLUSTER_ID}
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_PUBLIC_HOST}:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data

  clickhouse:
    # Tag "24" retire du Docker Hub gratuit (verifie au deploiement reel,
    # meme mesaventure que Bitnami ci-dessus) : latest a la place, image
    # officielle activement maintenue, acceptable pour une instance de
    # demo temporaire (pas une prod a long terme necessitant un pin strict).
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=automeca
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse-init:/docker-entrypoint-initdb.d:ro

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - clickhouse
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-provisioning:/etc/grafana/provisioning:ro

volumes:
  kafka_data:
  clickhouse_data:
  grafana_data:
