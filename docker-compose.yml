# Kafka + ClickHouse + Grafana auto-heberges (Bloc 3) — sur l'instance
# Compute OVHcloud partagee avec les conteneurs API/UI du Bloc 4 (voir
# le README du Bloc 2, section "Contraintes de cout et choix
# d'infrastructure OVHcloud", pour la justification complete : Kafka et
# ClickHouse manages coutent a eux seuls plus que le credit d'essai
# entier).
#
# Le pipeline Bloc 3 (Airflow, extraction, ingestion) tourne EN LOCAL
# sur le poste candidat (voir README, section "Mode d'execution
# Airflow") — pas sur cette instance. Kafka et ClickHouse doivent donc
# etre joignables depuis l'exterieur : ports publies sur l'IP publique
# de l'instance, restreints par le pare-feu reseau OVHcloud a l'IP du
# poste candidat (pas de VPN complet : disproportionne pour une demo de
# certification limitee dans le temps).
#
# Pas de TLS entre le pipeline local et ClickHouse (port HTTP 8123, pas
# 8443) : la protection en transit repose ici sur la restriction IP du
# pare-feu, pas le chiffrement — compromis assume, documente dans
# .env.example. Meme principe pour Kafka (PLAINTEXT, pas SASL_SSL).
services:
  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_PUBLIC_HOST}:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka

  clickhouse:
    image: clickhouse/clickhouse-server:24
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=automeca
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse-init:/docker-entrypoint-initdb.d:ro

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - clickhouse
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-provisioning:/etc/grafana/provisioning:ro

volumes:
  kafka_data:
  clickhouse_data:
  grafana_data:
